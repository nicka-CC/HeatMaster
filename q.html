  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

shuffleArray(questions);

const quiz = document.getElementById("quiz");

questions.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `<p>${i+1}. ${q[0]}</p>`;

  // Store the correct answer value and shuffle options
  const correctAnswerText = q[1][q[2]];
  shuffleArray(q[1]);
  q[2] = q[1].indexOf(correctAnswerText); // Update correct answer index

  q[1].forEach((a, j) => {
    div.innerHTML += `
      <label>
        <input type="radio" name="q${i}" value="${j}"> ${a}
      </label><br>`;
  });
  quiz.appendChild(div);
});
</script>

<button type="button" onclick="check()">Проверить</button>
<div class="result" id="result"></div>

</form>
</div>

<script>
function check() {
  let score = 0;
  questions.forEach((q, i) => {
    const answers = document.getElementsByName("q"+i);
    answers.forEach(a => {
      a.parentElement.classList.remove("correct","wrong");
      if (a.checked) {
        if (parseInt(a.value) === q[2]) {
          score++;
          a.parentElement.classList.add("correct");
        } else {
          a.parentElement.classList.add("wrong");
        }
      }
    });
  });
  document.getElementById("result").innerText =
    `Результат: ${score} из ${questions.length}`;
}
</script>
