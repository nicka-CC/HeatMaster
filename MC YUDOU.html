<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  max-width: 800px;
  width: 100%;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
#question-text {
  font-size: 20px;
  margin-bottom: 25px;
  min-height: 80px;
}
#answers-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
}
.answer-btn {
  width: 100%;
  padding: 15px;
  font-size: 16px;
  cursor: pointer;
  border: 1px solid #ddd;
  background: #f9f9f9;
  border-radius: 5px;
  text-align: left;
  transition: background-color 0.3s, border-color 0.3s;
}
.answer-btn:hover:not(:disabled) {
  background: #e9e9e9;
}
.answer-btn.correct {
  background-color: #d4edda;
  border-color: #c3e6cb;
  color: #155724;
  font-weight: bold;
}
.answer-btn.wrong {
  background-color: #f8d7da;
  border-color: #f5c6cb;
  color: #721c24;
  font-weight: bold;
}
.answer-btn:disabled {
  cursor: not-allowed;
}
#next-button {
  padding: 12px 25px;
  font-size: 16px;
  cursor: pointer;
  display: block;
  margin: 30px auto 0;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
}
#next-button:disabled {
    background-color: #cccccc;
}
#feedback {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  min-height: 25px;
}
.correct-text { color: green; }
.wrong-text { color: red; }

const questionTextEl = document.getElementById('question-text');
const answersContainerEl = document.getElementById('answers-container');
const feedbackEl = document.getElementById('feedback');
const nextButton = document.getElementById('next-button');

let currentQuestionIndex = 0;
let correctAnswerText = '';

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function showQuestion() {
  feedbackEl.innerHTML = '';
  nextButton.disabled = true;
  
  if (currentQuestionIndex >= questions.length) {
      questionTextEl.textContent = 'Тест завершен!';
      answersContainerEl.innerHTML = '';
      feedbackEl.innerHTML = `Вы ответили на все вопросы. Чтобы начать заново, обновите страницу.`;
      nextButton.textContent = 'Начать заново';
      nextButton.disabled = false;
      nextButton.onclick = () => location.reload();
      return;
  }

  const questionData = questions[currentQuestionIndex];
  const question = questionData[0];
  const answers = [...questionData[1]];
  correctAnswerText = answers[questionData[2]];

  shuffleArray(answers);

  questionTextEl.textContent = `${currentQuestionIndex + 1}. ${question}`;
  answersContainerEl.innerHTML = '';

  answers.forEach(answer => {
    const button = document.createElement('button');
    button.textContent = answer;
    button.classList.add('answer-btn');
    button.onclick = () => selectAnswer(button, answer);
    answersContainerEl.appendChild(button);
  });
}

function selectAnswer(selectedButton, selectedAnswer) {
  const isCorrect = selectedAnswer === correctAnswerText;

  Array.from(answersContainerEl.children).forEach(button => {
    button.disabled = true;
    if (button.textContent === correctAnswerText) {
      button.classList.add('correct');
    } else if (button === selectedButton) {
      button.classList.add('wrong');
    }
  });

  if (isCorrect) {
    feedbackEl.textContent = 'Правильно!';
    feedbackEl.className = 'correct-text';
  } else {
    feedbackEl.textContent = 'Неправильно!';
    feedbackEl.className = 'wrong-text';
  }

  nextButton.disabled = false;
}

nextButton.addEventListener('click', () => {
    currentQuestionIndex++;
    showQuestion();
});

// Initial load
shuffleArray(questions);
showQuestion();
