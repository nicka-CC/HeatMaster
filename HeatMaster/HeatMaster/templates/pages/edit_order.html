{% extends './layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/thermostats.css' %}">
{% endblock %}

{% block content %}
<div class="content">
    <div class="padding"></div>
    <div class="content_info">
        <div class="bread_crumps"><a href="{% url 'home' %}">Главная</a> / <a href="{% url 'all_orders' %}">Все заказы</a> / <div class="bread_crump">Редактировать заказ №{{ order.id }}</div></div>

        <div class="orders-container">
            <h2 class="orders-title">Редактировать заказ №{{ order.id }}</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-save">Сохранить изменения</button>
            </form>
        </div>
    </div>
    <div class="padding2"></div>
</div>
{% endblock %}
